<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOOP Dashboard</title></head><body><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/matthewyik/whoop/main/dashboard_base.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let s=await r.text();const old='const latest = latestScored(WHOOP.recovery || []);const latestDate = latest ? dateKey(latest.created_at) : "unknown";const now = new Date();status.textContent = `Auto-refresh on · WHOOP through ${latestDate} · checked ${now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`;';const neu='const latest = latestScored(WHOOP.recovery || []);const latestDate = latest ? dateKey(latest.created_at) : "unknown";const records=[...(WHOOP.recovery||[]),...(WHOOP.cycles||[]),...(WHOOP.sleep||[]),...(WHOOP.workouts||[])];const timestamps=records.map(x=>x.updated_at||x.created_at).filter(Boolean).map(x=>new Date(x)).filter(x=>!Number.isNaN(x.getTime()));const lastWhoop=timestamps.length?new Date(Math.max(...timestamps.map(x=>x.getTime()))):null;const whoopTime=lastWhoop?lastWhoop.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):latestDate;status.textContent=`Last WHOOP data · ${whoopTime}`;';if(!s.includes(old))throw new Error('Timestamp patch target not found');s=s.replace(old,neu);document.open();document.write(s);document.close();}catch(e){document.body.style.cssText='background:#060908;color:white;font-family:system-ui;padding:24px';document.body.textContent='Dashboard failed to load: '+e.message;}})();</script></body></html>
