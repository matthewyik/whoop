name: Fix three orb layout

on:
  push:
    paths:
      - '.github/workflows/fix-three-orb-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sleep and strain orbs clearly visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')

          reps={
            '.orb-card{min-height:455px;display:grid;place-items:center;position:relative;overflow:hidden}':'.orb-card{min-height:455px;display:grid;grid-template-columns:minmax(0,1fr) 118px;align-items:center;gap:18px;position:relative;overflow:hidden;padding:20px 22px}',
            '.orb-stage{position:relative;width:min(390px,80vw);aspect-ratio:1;z-index:1}':'.orb-stage{position:relative;width:min(360px,100%);aspect-ratio:1;z-index:1;justify-self:center}',
            '.mini-orb-row{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;z-index:2;pointer-events:none}':'.mini-orb-row{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;z-index:2;pointer-events:none}',
            '.mini-orb{--mini:74,179,255;width:92px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(var(--mini),.26),rgba(var(--mini),.08) 55%,rgba(var(--mini),.02) 70%);border:2px solid rgba(var(--mini),.72);box-shadow:0 0 26px rgba(var(--mini),.18),inset 0 0 20px rgba(var(--mini),.08)}':'.mini-orb{--mini:74,179,255;width:108px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 38%,rgba(var(--mini),.40),rgba(var(--mini),.16) 48%,rgba(var(--mini),.04) 72%);border:3px solid rgba(var(--mini),.82);box-shadow:0 0 34px rgba(var(--mini),.28),inset 0 0 26px rgba(var(--mini),.12)}',
            '.mini-orb-value{font-size:25px;font-weight:850;line-height:.95;letter-spacing:-.04em}':'.mini-orb-value{font-size:29px;font-weight:850;line-height:.95;letter-spacing:-.04em}',
            '@media(max-width:850px){.hero,.grid2,.foot{grid-template-columns:1fr}.orb-card{min-height:390px}': '@media(max-width:850px){.hero,.grid2,.foot{grid-template-columns:1fr}.orb-card{min-height:390px;grid-template-columns:minmax(0,1fr) 110px}',
            '@media(max-width:560px){.mini-orb-row{left:12px;right:12px;bottom:12px}.mini-orb{width:76px}.mini-orb-value{font-size:21px}.shell{': '@media(max-width:560px){.orb-card{min-height:470px;grid-template-columns:1fr;grid-template-rows:1fr auto;gap:8px;padding:15px}.mini-orb-row{display:flex;flex-direction:row;gap:28px}.mini-orb{width:88px}.mini-orb-value{font-size:24px}.shell{'
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit(f'Missing expected CSS: {old[:80]}')
              s=s.replace(old,new,1)

          # Clarify sleep score source and use latest cycle strain.
          old='<div class="mini-orb-label">SLEEP</div><div class="mini-orb-sub">score</div>'
          new='<div class="mini-orb-label">SLEEP</div><div class="mini-orb-sub">performance</div>'
          if old not in s:
              raise SystemExit('Sleep label anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('dashboard.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Commit fixed three-orb layout
        run: |
          rm .github/workflows/fix-three-orb-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/fix-three-orb-layout.yml
          git commit -m "Fix three-orb recovery panel layout"
          git push