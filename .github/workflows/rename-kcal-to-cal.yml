name: Rename kcal labels to cal

on:
  push:
    paths:
      - '.github/workflows/rename-kcal-to-cal.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace kcal with cal in dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('kcal', 'cal')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          rm .github/workflows/rename-kcal-to-cal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/rename-kcal-to-cal.yml
          git commit -m "Rename kcal labels to cal"
          git push
