name: Rename dashboard to Road to Base

on:
  push:
    paths:
      - '.github/workflows/rename-road-to-base.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<title>Muscle Gain OS — WHOOP Dashboard</title>':'<title>Road to Base</title>',
            '<h1>Recovery → action.</h1>':'<h1>Road to Base</h1>'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Anchor not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate title
        run: |
          grep -q '<title>Road to Base</title>' dashboard.html
          grep -q '<h1>Road to Base</h1>' dashboard.html
      - name: Commit rename
        run: |
          rm .github/workflows/rename-road-to-base.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/rename-road-to-base.yml
          git commit -m "Rename dashboard to Road to Base"
          git push
