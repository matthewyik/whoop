name: Fix WHOOP data timestamp

on:
  push:
    paths:
      - '.github/workflows/fix-whoop-timestamp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put WHOOP timestamp logic directly in dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard_base.html')
          s = p.read_text(encoding='utf-8')
          old = '''const latest = latestScored(WHOOP.recovery || []);const latestDate = latest ? dateKey(latest.created_at) : "unknown";const now = new Date();status.textContent = `Auto-refresh on · WHOOP through ${latestDate} · checked ${now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`;'''
          new = '''const latest = latestScored(WHOOP.recovery || []);const latestDate = latest ? dateKey(latest.created_at) : "unknown";const records=[...(WHOOP.recovery||[]),...(WHOOP.cycles||[]),...(WHOOP.sleep||[]),...(WHOOP.workouts||[])];const timestamps=records.map(x=>x.updated_at||x.created_at).filter(Boolean).map(x=>new Date(x)).filter(x=>!Number.isNaN(x.getTime()));const lastWhoop=timestamps.length?new Date(Math.max(...timestamps.map(x=>x.getTime()))):null;const whoopTime=lastWhoop?lastWhoop.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):latestDate;status.textContent=`Last WHOOP data · ${whoopTime}`;'''
          if old in s:
              s = s.replace(old, new)
          elif 'Last WHOOP data · ${whoopTime}' not in s:
              raise SystemExit('Could not find timestamp block')
          p.write_text(s, encoding='utf-8')
          Path('dashboard.html').write_text(s, encoding='utf-8')
          PY
      - name: Commit fixed dashboard
        run: |
          rm .github/workflows/fix-whoop-timestamp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html dashboard_base.html .github/workflows/fix-whoop-timestamp.yml
          git commit -m "Show latest WHOOP data timestamp directly"
          git push
