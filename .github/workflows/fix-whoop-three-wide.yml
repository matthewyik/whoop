name: Fix WHOOP three-wide orbs

on:
  push:
    paths:
      - '.github/workflows/fix-whoop-three-wide.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix three-wide orb panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')

          reps={
            '.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;align-items:stretch}':'.hero{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}',
            '.orb-card{min-height:300px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));':'.orb-card{grid-column:1/-1;min-height:300px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));',
            '.orb-stage{position:relative;width:min(100%,170px);aspect-ratio:1}':'.orb-stage{position:relative;width:min(100%,240px);aspect-ratio:1}',
            '.stack{display:grid;gap:18px}':'.stack{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px}',
            '@media(max-width:850px){.hero,.grid2,.foot{grid-template-columns:1fr}.orb-card{min-height:260px;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px}.orb-stage{width:min(100%,150px)}.settings': '@media(max-width:850px){.hero,.grid2,.foot{grid-template-columns:1fr}.stack{grid-template-columns:1fr}.orb-card{min-height:260px;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px}.orb-stage{width:min(100%,180px)}.settings',
            '.decision{padding:15px}.orb-stage{width:min(330px,88vw)}.log-item':'.decision{padding:15px}.log-item'
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit(f'Missing expected CSS: {old[:90]}')
              s=s.replace(old,new,1)

          rec='<div class="orb-unit"><div class="orb-stage"><canvas id="orb"></canvas><div class="orb-mid"><div><div class="orb-value" id="orbValue">—</div><div class="orb-caption">RECOVERY</div><div class="orb-state" id="orbState">—</div></div></div></div></div>'
          sleep='<div class="orb-unit"><div class="orb-stage"><canvas id="sleepOrbCanvas"></canvas><div class="orb-mid"><div><div class="orb-value" id="sleepOrbValue">—</div><div class="orb-caption">SLEEP</div><div class="orb-state" id="sleepOrbState">PERFORMANCE</div></div></div></div></div>'
          if rec+sleep not in s:
              raise SystemExit('Could not find Recovery then Sleep blocks')
          s=s.replace(rec+sleep,sleep+rec,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate dashboard and order
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('dashboard.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          assert s.index('id="sleepOrbCanvas"') < s.index('id="orb"') < s.index('id="strainOrbCanvas"')
          assert 'grid-column:1/-1;min-height:300px' in s
          assert '.orb-stage{width:min(330px,88vw)}' not in s
          PY
          node --check /tmp/dashboard.js
      - name: Commit fixed WHOOP layout
        run: |
          rm .github/workflows/fix-whoop-three-wide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/fix-whoop-three-wide.yml
          git commit -m "Fix WHOOP three-wide orb layout"
          git push
