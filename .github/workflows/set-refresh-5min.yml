name: Set dashboard refresh to 5 minutes

on:
  push:
    paths:
      - '.github/workflows/set-refresh-5min.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update refresh interval
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const AUTO_REFRESH_MS = 30 * 60 * 1000;', 'const AUTO_REFRESH_MS = 5 * 60 * 1000;')
          s = s.replace('on startup and every 30 minutes.', 'on startup and every 5 minutes.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit dashboard update and remove one-time workflow
        run: |
          rm .github/workflows/set-refresh-5min.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Check local WHOOP data every 5 minutes"
          git push
